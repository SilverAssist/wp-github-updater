# Calls the shared action in SilverAssist/workflows (dependabot-auto-merge@v1).
#
# The logic lives in SilverAssist/workflows. This file only decides when it
# runs and what the token may do. The job-level `if:` keeps a write-scoped
# token away from other contributors' pull requests; the action then refuses
# anything that is not a Dependabot pull request event, and anything whose
# head moved or carries a commit that is not a verified Dependabot commit.
#
# Requirements in this repo (the SilverAssist/workflows README explains why):
# - "Allow auto-merge" on.
# - "Allow GitHub Actions to create and approve pull requests" on.
# - Required status checks on the default branch, in the main-protection ruleset.
# - Stale approvals dismissed on push in the branch ruleset.
name: Auto-merge Dependabot PRs

on: pull_request

permissions: {}

# A newer push to the same pull request supersedes the run for the older one.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: SilverAssist/workflows/dependabot-auto-merge@v1
