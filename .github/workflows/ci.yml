name: CI

# Runs on every pull request and every push to main, so a change is checked
# before a tag is pushed. create-release.yml keeps its own test run as a last
# gate for the tag.

permissions:
    contents: read

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Code standards and static analysis
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
              with:
                  php-version: "8.2"
                  extensions: mbstring, xml, ctype, json, tokenizer
                  coverage: none
                  tools: composer:v2

            # The SilverAssist development dependencies come from GitHub vcs
            # repositories, so composer needs a token (see README, "Installing via
            # Composer").
            - name: Install Composer dependencies
              env:
                  COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
              run: composer install --no-interaction --no-progress --optimize-autoloader

            - name: Validate composer.json
              run: composer validate --strict

            - name: PHP CodeSniffer
              run: composer phpcs

            - name: PHPStan
              run: composer phpstan

    tests-wordpress:
        name: Tests on the WordPress test suite (PHP ${{ matrix.php-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.2", "8.3", "8.4"]

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: mbstring, xml, ctype, json, tokenizer, mysqli
                  coverage: none
                  tools: composer:v2

            - name: Setup MySQL
              run: |
                  sudo systemctl start mysql.service
                  mysql -e "CREATE DATABASE IF NOT EXISTS wordpress_test;" -uroot -proot
                  mysql -e "CREATE USER IF NOT EXISTS 'wp_test'@'localhost' IDENTIFIED BY 'wp_test';" -uroot -proot
                  mysql -e "GRANT ALL PRIVILEGES ON wordpress_test.* TO 'wp_test'@'localhost';" -uroot -proot
                  mysql -e "FLUSH PRIVILEGES;" -uroot -proot

            - name: Install Subversion (required by the WordPress test suite)
              run: |
                  sudo apt-get update
                  sudo apt-get install -y subversion

            - name: Install Composer dependencies
              env:
                  COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
              run: composer install --no-interaction --no-progress --optimize-autoloader

            - name: Install WordPress test suite
              run: bash scripts/install-wp-tests.sh wordpress_test wp_test wp_test localhost latest

            # WP_TESTS_DIR switches tests/bootstrap.php to the real WordPress test
            # suite, so nothing from WordPress core is mocked and every suite
            # (unit, integration, wordpress) runs against real core.
            - name: PHPUnit (real WordPress)
              env:
                  WP_TESTS_DIR: /tmp/wordpress-tests-lib
              run: ./vendor/bin/phpunit --configuration=phpunit.xml

    tests-standalone:
        name: Unit tests without WordPress
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
              with:
                  php-version: "8.2"
                  extensions: mbstring, xml, ctype, json, tokenizer
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              env:
                  COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
              run: composer install --no-interaction --no-progress --optimize-autoloader

            # Without WP_TESTS_DIR the bootstrap loads tests/wordpress-mocks.php,
            # which is how a contributor without a database runs the suite.
            - name: PHPUnit (standalone)
              run: ./vendor/bin/phpunit --configuration=phpunit.xml --testsuite unit,integration
